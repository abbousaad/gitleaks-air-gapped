stages:
  - docker
  - notify

variables:
  GITLEAKS_VERSION: "v8.28.0"
  SOURCE_IMAGE: "zricethezav/gitleaks:${GITLEAKS_VERSION}"
  TARGET_IMAGE: "${CI_REGISTRY}/security/gitleaks:${GITLEAKS_VERSION}"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

docker-build-and-push:
  stage: docker
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
      alias: docker
      command: ["--insecure-registry=192.168.11.222:5050"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""   # disable TLS
  tags:
    - security-tools
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Build the custom image using the Dockerfile
    - echo "Building custom Gitleaks image with custom rules..."
    - docker build -t "${TARGET_IMAGE}" .
    - echo "Custom image built successfully"
    # Push to local registry
    - echo "Pushing custom image to local registry..."
    - docker push "${TARGET_IMAGE}"
    # Clean up
    - docker rmi "${TARGET_IMAGE}" || true
  only:
    - main
    - tags
  when: on_success

notify-success:
  stage: notify
  image: alpine/curl:8.12.0
  tags:
    - security-tools
  script:
    - |
      curl -X POST \
        -u "$NEXCLOUD_USERNAME:$NEXCLOUD_PASSWORD" \
        -H "OCS-APIRequest: true" \
        -H "Content-Type: application/json" \
        --data-raw "{\"message\": \"🔒 New Custom Gitleaks Image Available in Local Registry!\\n\\n📋 Details:\\n• Commit: $CI_COMMIT_SHORT_SHA\\n• Branch: $CI_COMMIT_REF_NAME\\n• Pipeline: $CI_PIPELINE_ID\\n• Triggered by: $GITLAB_USER_NAME\\n\\n🐳 New Image: $TARGET_IMAGE\\n\\n✅ Custom Gitleaks image has been successfully built and pushed to the local registry.\\n\\n🔍 Ready for use in CI/CD pipelines:\\n• Version: $GITLEAKS_VERSION\\n• Features: Custom security rules and configurations\\n• Base: Docker Hub official image with enhancements\"}" \
        "$NEXCLOUD_URL/ocs/v2.php/apps/spreed/api/v1/chat/$NEXCLOUD_CONVERSATION_TOKEN"
  only:
    - main
  when: on_success
